<div class="bg-[--step-bg] py-2 md:min-h-auto" [attr.data-theme]="variant()">
  <div class="hidden md:block relative w-[61%] my-10 left-14">
    <div
      class="absolute inset-x-0 top-1/2 h-[2px] bg-[#FDD6BA] "
    ></div>
    <div class="relative z-10 flex justify-between gap-4 mx-auto">
      <span class="circle bg-[--step-bg-circle]"></span>
      <span class="circle bg-[--step-bg-circle]"></span>
      <span class="circle bg-[--step-bg-circle]"></span>
    </div>
  </div>
  <div class="md:w-[87%] md:min-h-auto md:grid md:grid-cols-3 md:gap-6 md:ml-5">
    @for (item of step(); track $index) {
    <app-step-card [stepItem]="item" [variant]="variant()"/>
    }
  </div>
</div>
