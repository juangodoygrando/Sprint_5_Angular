<header
  class="flex justify-between items-center py-2 border-b border-none sm:mt-3 md:mt-4 z-50"
>
  <div class="flex justify-between w-full mt-2 mb-4">
    <img
      src="/assets/shared/desktop/logo.svg"
      alt="logo coffeeroasters"
      class="h-4 md:h-6"
    />

    <button (click)="toggleMenu()" class="md:hidden border-none">
      @if(!menuOpen()){<img
        class="burguerMenuIcon"
        src="/assets/shared/mobile/icon-hamburger.svg"
        alt="Menu"
      />}@else {<img
        class="burguerMenu"
        src="/assets/shared/mobile/icon-close.svg"
        alt="Close menu"
      />}
    </button>
  </div>

  <nav
    class="hidden md:flex gap-6 whitespace-nowrap text-gray-500 font-semibold text-[10px] md:text-base"
  >
    <a href="#">HOME</a>
    <a href="#">ABOUT US</a>
    <a href="#">CREATE YOU PLAN</a>
  </nav>
</header>

@if(menuOpen()){
<nav
  class="fixed w-screen h-screen left-0 z-50 bg-white/90 flex flex-col text-center gap-4 font-bold"
>
  <a href="#">Home</a>
  <a href="#">About Us</a>
  <a href="#">Create Your Plan</a>
</nav>
}
