<div class="bg-white py-6 w-full">
  @for (item of stepForContent(); track item.orderState) {
  <details
    class="mb-6"
    [open]="coffeePlanService.currentStep() === item.stepNumber"
    (toggle)="onToggle(item.stepNumber, $event)"
  >
    <summary
      class="text-gray-500 font-bold list-none flex flex-row justify-between items-center"
    >
      <h2 class="w-10/12 text-xl tracking-wide">{{ item.stepTitle }}</h2>
      <img
        src="assets/plan/desktop/icon-arrow.svg"
        class="w-4 transition-transform"
      />
    </summary>

    <fieldset class="space-y-4 py-2">
      @for (option of item.stepOptions; track option.stepOptionId) {
      <div
        class="option-card"
        [class.selected]="
          coffeePlanService.orderState()[item.orderState] ===
          option.stepOptionId
        "
        (click)="selectedId(item.orderState, option.stepOptionId)"
      >
        <p class="font-bold text-sm mb-2">{{ option.stepOptionTitle }}</p>
        <p class="text-xs font-light opacity-90">
          {{ option.stepOptionDescribe }}
        </p>
      </div>
      }
    </fieldset>
  </details>
  }
</div>
