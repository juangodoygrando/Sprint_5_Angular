<div class="relative md:mt-32">

  <h2 class="text-center text-3xl font-black maskTitle
             md:text-[10rem] md:absolute md:left-0 md:right-0 md:top-0
             md:-translate-y-1/3 md:z-0
             md:select-none md:pointer-events-none md:leading-none">
    our collection
  </h2>


  <div class="grid grid-cols-1 justify-center md:grid-cols-4 gap-6 mt-2
              md:relative md:z-10 md:pt-24">
    @for (item of ourCollection; track $index) {
      <div class="flex flex-col items-center gap-4">
        <img
          src="{{ item.collectionImage }}"
          alt="{{ item.collectionTitle }}"
        />
        <h3 class="text-2xl font-extrabold">{{ item.collectionTitle }}</h3>
        <p class="text-center font-poppins font-light">{{ item.collectionDescription }}</p>
      </div>
    }
  </div>
</div>
